<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DrawBridge{% endblock %}</title>
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('home') }}">DrawBridge</a>
            <a href="{{ url_for('home') }}">Active Raffles</a>

            {% if current_user.is_authenticated %}
                <span>Signed in as {{ current_user.name }}</span>

                {% if current_user.is_organizer %}
                    <a href="{{ url_for('organizer_dashboard') }}">
                        Organizer
                    </a>
                {% endif %}

                <form method="post" action="{{ url_for('logout') }}">
                    <button type="submit">Log Out</button>
                </form>
            {% else %}
                <a href="{{ url_for('login') }}">Log In</a>
                <a href="{{ url_for('register') }}">Register</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>DrawBridge Raffle Management System</p>
    </footer>
</body>
</html>
