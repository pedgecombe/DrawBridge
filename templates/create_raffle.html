{% extends "base.html" %}

{% block title %}Create Raffle | DrawBridge{% endblock %}

{% block content %}
    <h1>Create a Raffle</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        <div>
            <label for="title">Raffle title</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div>
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                required
            ></textarea>
        </div>

        <div>
            <label for="prize">Prize</label>
            <input type="text" id="prize" name="prize" required>
        </div>

        <div>
            <label for="ticket_price">Ticket price</label>
            <input
                type="number"
                id="ticket_price"
                name="ticket_price"
                min="0.01"
                step="0.01"
                required
            >
        </div>

        <div>
            <label for="ticket_limit">Maximum tickets</label>
            <input
                type="number"
                id="ticket_limit"
                name="ticket_limit"
                min="1"
                required
            >
        </div>

        <div>
            <label for="closing_date">Closing date and time</label>
            <input
                type="datetime-local"
                id="closing_date"
                name="closing_date"
                required
            >
        </div>

        <button type="submit">Create Raffle</button>
    </form>

    <a href="/organizer">Return to Dashboard</a>
{% endblock %}
