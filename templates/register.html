{% extends "base.html" %}

{% block title %}Register | DrawBridge{% endblock %}

{% block content %}
    <h1>Create a Participant Account</h1>
    <p>Register to access DrawBridge as a raffle participant.</p>

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}

    <form method="post">
        <div>
            <label for="name">Full name</label>
            <input
                type="text"
                id="name"
                name="name"
                required
                autocomplete="name"
            >
        </div>

        <div>
            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
            >
        </div>

        <div>
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
                autocomplete="new-password"
            >
        </div>

        <div>
            <label for="confirm_password">Confirm password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                minlength="8"
                required
                autocomplete="new-password"
            >
        </div>

        <button type="submit">Create Account</button>
    </form>

    <p>
        Already registered?
        <a href="{{ url_for('login') }}">Log in</a>
    </p>
{% endblock %}
